! netops-lab: /etc/frr/frr.conf for goguma (the Pi). See decisions/010.
!
! provisioning/frr-install.sh checks this file with "vtysh --dryrun" and then
! copies it to /etc/frr/frr.conf. Do not edit the copy on the Pi.
!
! NOT YET APPLIED TO HARDWARE (2026-09-30). The run sheet is docs/frr-bringup.md.
!
! Addressing this file uses:
!   eth0     192.168.99.2/30   point-to-point link to the hEX ether1 (.1), decisions/006
!   lo       10.255.0.2/32     Pi router ID, carried in OSPF
!   lo       10.255.1.1/32     Pi service prefix, announced in eBGP only
!   wlan0    house wifi        NOT in FRR. The Pi default route stays here.
!   hEX      10.255.0.1/32     router loopback, learned in OSPF
!   hEX      192.168.88.0/24   lab LAN on the bridge, learned in OSPF
!
! The self-lockout guard is the FIB-GUARD route-map near the bottom of this file.
! Read it before you change anything that affects which routes the Pi accepts.
!
frr defaults traditional
hostname goguma
log syslog informational
service integrated-vtysh-config
!
! --- Interfaces --------------------------------------------------------------
! eth0 keeps its address from the NetworkManager connection "lab" (see
! docs/bring-up-notes.md). FRR does not set an address on eth0 and does not
! shut it down. The management path to the router depends on eth0.
!
interface eth0
 description lab link to hEX ether1 (management path, decisions/006)
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
! zebra adds these two addresses to lo. They are host routes, so they do not
! overlap with any address on eth0 or wlan0.
!
interface lo
 ip address 10.255.0.2/32
 ip address 10.255.1.1/32
exit
!
! --- OSPF: the link and the loopbacks ---------------------------------------
! The network statements are exact. They match only the eth0 /30 and the
! router-ID /32. They do not match wlan0, 10.255.1.1/32, or 127.0.0.1.
! There is no "redistribute" and no "default-information originate".
!
router ospf
 ospf router-id 10.255.0.2
 network 192.168.99.0/30 area 0
 network 10.255.0.2/32 area 0
exit
!
! --- eBGP: the Pi announces its service prefix to the router ---------------
! Private ASNs (RFC 6996): the hEX is 65001, the Pi is 65002.
! The Pi opens the session (bgpd runs with "-p 0" in frr/daemons).
! The Pi sends one prefix and accepts no prefixes.
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 neighbor 192.168.99.1 remote-as 65001
 neighbor 192.168.99.1 description hEX lab-router
 !
 address-family ipv4 unicast
  network 10.255.1.1/32
  neighbor 192.168.99.1 activate
  neighbor 192.168.99.1 route-map BGP-IN in
  neighbor 192.168.99.1 route-map BGP-OUT out
 exit-address-family
exit
!
ip prefix-list PL-BGP-OUT seq 10 permit 10.255.1.1/32
!
route-map BGP-OUT permit 10
 match ip address prefix-list PL-BGP-OUT
exit
!
! The router sends nothing (output.filter-chain=bgp-out rejects all). This
! deny is the second barrier: if the router side changes, the Pi still
! accepts no BGP route, and so it cannot learn a default route from BGP.
!
route-map BGP-IN deny 10
exit
!
! --- FIB-GUARD: the self-lockout guard -------------------------------------
! zebra applies this route-map before it installs an OSPF or BGP route in the
! kernel. It is an allow-list. Only the lab loopbacks and the lab LAN pass.
!
! A default route, the house LAN, or any other prefix from OSPF or BGP stays
! in the FRR RIB and never reaches the kernel. So the Pi default route and
! its house-LAN route stay on wlan0, and the SSH session to the Pi stays up.
!
! Do not add a permit for 0.0.0.0/0 or for the house LAN. decisions/010 says why.
!
ip prefix-list PL-FIB-ALLOW seq 10 permit 10.255.0.0/16 le 32
ip prefix-list PL-FIB-ALLOW seq 20 permit 192.168.88.0/24
!
route-map FIB-GUARD permit 10
 match ip address prefix-list PL-FIB-ALLOW
exit
!
route-map FIB-GUARD deny 20
exit
!
ip protocol ospf route-map FIB-GUARD
ip protocol bgp route-map FIB-GUARD
!
line vty
exit
!
